name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npm run build
      - run: node --check scripts/check-version.mjs

  electron-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:electron:win
        env:
          WEB_REVISION_ELECTRON_RELEASE: "1"
      - name: Smoke test packaged Electron editor
        shell: pwsh
        run: |
          $archive = Get-ChildItem release-electron -Filter *-electron-win-x64.zip | Select-Object -First 1
          if (-not $archive) { throw "Electron release ZIP was not created." }
          $patch = Get-ChildItem release-electron -Filter *-patch.zip | Select-Object -First 1
          if (-not $patch) { throw "Electron app-only patch ZIP was not created." }
          if ($patch.Length -ge $archive.Length) { throw "The app-only patch is not smaller than the full ZIP." }
          $metadata = Get-Content -Raw release-electron/release.json | ConvertFrom-Json
          if ($metadata.assets.patch.name -ne $patch.Name) { throw "Patch metadata does not match the patch asset." }
          if ($metadata.assets.patch.targetElectronVersion -ne $metadata.electronVersion) { throw "Patch Electron compatibility metadata is inconsistent." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $patchZip = [System.IO.Compression.ZipFile]::OpenRead($patch.FullName)
          try {
            $entries = @($patchZip.Entries)
            if (-not ($entries | Where-Object FullName -eq "resources/app/package.json")) { throw "Patch ZIP is missing resources/app/package.json." }
            if ($entries | Where-Object { $_.FullName -and -not $_.FullName.StartsWith("resources/app/") }) { throw "Patch ZIP contains files outside resources/app." }
          } finally {
            $patchZip.Dispose()
          }
          $hashes = Get-Content release-electron/SHA256SUMS.txt
          foreach ($asset in @($archive, $patch)) {
            $actualHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not ($hashes | Where-Object { $_ -match "^$actualHash\s+$([regex]::Escape($asset.Name))$" })) {
              throw "SHA256SUMS.txt is missing the correct checksum for $($asset.Name)."
            }
          }
          $target = Join-Path $env:RUNNER_TEMP "electron-ci-smoke"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $target -Force
          $executable = Get-ChildItem $target -Filter WebRevisionDesk.exe -Recurse | Select-Object -First 1
          if (-not $executable) { throw "Packaged Electron executable was not found." }
          $process = Start-Process -FilePath $executable.FullName -ArgumentList "--editor-smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Electron editor smoke test failed with exit code $($process.ExitCode)." }
      - name: Smoke test app-only patch application
        shell: pwsh
        run: |
          ./tests/windows/update-patch-smoke.ps1 -UpdaterPath ./electron/updater.ps1 -ScratchDirectory $env:RUNNER_TEMP
